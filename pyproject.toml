[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-judge-cascade"
version = "0.1.0"
description = "Cost-tiered LLM-as-judge cascade for evaluating AI agent outputs and generating preference data."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "KaCee Kremeier" }]
requires-python = ">=3.11"
keywords = [
    "llm",
    "evaluation",
    "judge",
    "cascade",
    "dpo",
    "preference-data",
    "ai-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.31",
    "pydantic>=2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "mypy>=1.8",
    "ruff>=0.4",
]

[project.scripts]
judge-cascade = "llm_judge_cascade.cli:main"

[project.urls]
Homepage = "https://github.com/kceekremeier/llm-judge-cascade"
Issues = "https://github.com/kceekremeier/llm-judge-cascade/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_judge_cascade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
