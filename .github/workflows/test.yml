name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
        # setup-uv@v5 with python-version: auto-creates .venv and exports
        # VIRTUAL_ENV, so a separate `uv venv` step is redundant — and worse,
        # it errors out with "A virtual environment already exists." Drop it.

      - name: Install package + dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Run pytest
        run: uv run pytest tests/ -v

      - name: Lint with ruff
        run: uv run ruff check src/ tests/
